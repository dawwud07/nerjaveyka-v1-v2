[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nerjaveyka"
version = "0.1.0"
description = "Django REST API for the Nerjaveyka catalog and inquiry website."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "drf-yasg>=1.21.10,<2.0",
    "django-filter>=25.1,<26.0",
    "django-cors-headers>=4.7,<5.0",
    "dj-database-url>=2.3,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "whitenoise>=6.8,<7.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.1,<8.0",
    "black>=24.10,<26.0",
    "isort>=5.13,<7.0",
    "pytest-django>=4.9,<5.0",
]

[tool.setuptools.packages.find]
include = ["api*", "apps*", "core*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line-length = 100
known_first_party = ["api", "apps", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
